<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comentários Públicos</title>
</head>
<body>
    <h1>Deixe seu Comentário</h1>
    
    <form action="/comments" method="POST">
        <div>
            <label for="author">Nome do Autor:</label><br>
            <input type="text" id="author" name="author" required>
        </div>
        <br>
        <div>
            <label for="content">Comentário:</label><br>
            <textarea id="content" name="content" rows="4" cols="50" required></textarea>
        </div>
        <br>
        <button type="submit">Enviar</button>
    </form>

    <hr>
    
    <h2>Buscar Comentários</h2>
    <form action="/search" method="GET">
        <input type="text" name="q" placeholder="Buscar..." required>
        <button type="submit">Buscar</button>
    </form>

    <hr>

    <h2>Todos os Comentários</h2>
    <ul>
        <li th:each="comment : ${comments}">
            <strong th:text="${comment.author}">Autor</strong> 
            <span th:text="'em ' + ${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">Data</span>
            <p th:text="${comment.content}">Texto do comentário</p>
        </li>
    </ul>
    
    <p th:if="${#lists.isEmpty(comments)}">Nenhum comentário cadastrado ainda.</p>
</body>
</html>
