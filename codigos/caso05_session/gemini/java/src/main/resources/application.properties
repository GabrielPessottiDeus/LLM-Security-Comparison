server.port=8005

# Configuracao dummy para o MySQL caso seja ativado no futuro
spring.datasource.url=jdbc:mysql://localhost:3306/meubanco?useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Como nao estamos usando o banco na pratica para essa implementacao (user em memoria), desabilitamos o auto-configure do DataSource
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration