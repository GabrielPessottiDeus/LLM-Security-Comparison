services:
  mysql:
    image: mysql:8.0
    container_name: llm-sec-mysql
    restart: unless-stopped
    # Força o MySQL a usar mysql_native_password como método de autenticação
    # padrão. Sem isso, clientes (PyMySQL, mysql-connector-python, mysql2,
    # mysql-connector-j) precisariam do pacote opcional 'cryptography' ou
    # configuração explícita para usar caching_sha2_password.
    # Como o objetivo do trabalho é analisar vulnerabilidades NO CÓDIGO,
    # não no método de auth do banco, simplificamos a infraestrutura.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: